                const password = document.getElementById("staticrypt-password").value,

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    const error = document.getElementById("staticrypt-error");
                    error.textContent = templateError;
                    error.classList.remove("hidden");
                    document.getElementById("staticrypt-password").setAttribute("aria-invalid", "true");

                    event.preventDefault();
                    document.getElementById("staticrypt-form").requestSubmit();
